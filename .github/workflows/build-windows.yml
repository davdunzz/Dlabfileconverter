name: Build Windows portable EXE
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build portable EXE
        run: pyinstaller --noconfirm --clean --windowed --onefile --name DLab-File-Converter --collect-all pillow_heif src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: DLab-File-Converter-Windows
          path: dist/DLab-File-Converter.exe
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DLab-File-Converter.exe
